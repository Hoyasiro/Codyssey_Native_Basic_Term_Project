<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>런크루 · 러닝 크루 매칭</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --primary:#20C0A1;
  --primary-press:#17A88B;
  --primary-050:#E9F8F4;
  --primary-100:#D3F1EA;
  --primary-200:#B4E7DC;
  --ink:#1B2430;
  --ink-2:#3B4654;
  --gray:#6B7684;
  --gray-2:#94A0AD;
  --line:#EDEFF2;
  --line-2:#E4E7EB;
  --bg:#FFFFFF;
  --bg-soft:#F5F6F8;
  --card:#FFFFFF;
  --shadow-sm:0 2px 8px rgba(24,39,54,.06);
  --shadow:0 8px 24px rgba(24,39,54,.08);
  --shadow-lg:0 16px 44px rgba(24,39,54,.14);
  --radius:20px;
  --radius-sm:14px;
  --star:#FBBF24;
  --danger:#F0576B;
  --tabbar-h:66px;
  --header-h:54px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Pretendard','Pretendard Variable',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#2B3440;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{display:block;max-width:100%;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--primary-200);}

/* ===== Phone Frame ===== */
.phone{
  position:relative;
  width:100%;
  max-width:440px;
  height:100vh;height:100dvh;
  max-height:940px;
  background:var(--bg);
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 40px 90px rgba(0,0,0,.5);
}
@media(min-width:480px){
  .phone{border-radius:38px;height:900px;}
  body{padding:20px;}
}
@media(max-width:479px){
  body{background:var(--bg);}
  .phone{max-height:none;box-shadow:none;}
}

/* ===== Scroll area ===== */
.viewport{position:relative;flex:1;overflow:hidden;}
.screen{
  position:absolute;inset:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:var(--bg);
  padding-bottom:calc(var(--tabbar-h) + 12px);
  display:none;
}
.screen.active{display:block;animation:fadeUp .28s ease;}
.screen.no-tabbar{padding-bottom:0;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.screen::-webkit-scrollbar{width:0;}

.pad{padding:0 20px;}
.pad-top{padding-top:calc(env(safe-area-inset-top) + 14px);}

/* ===== Typography ===== */
.h1{font-size:27px;font-weight:800;letter-spacing:-.6px;color:var(--ink);}
.h2{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--ink);}
.h3{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--ink);}
.muted{color:var(--gray);}
.tiny{font-size:12.5px;}
.brand-accent{color:var(--primary);}

/* ===== Top bar (home/list search) ===== */
.searchbar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-soft);
  border:1px solid transparent;
  border-radius:16px;
  padding:14px 16px;
  color:var(--gray-2);
  font-size:15px;
  transition:.18s;
}
.searchbar:focus-within{border-color:var(--primary-200);background:#fff;box-shadow:var(--shadow-sm);}
.searchbar svg{flex:none;color:var(--gray-2);}
.searchbar input{
  border:none;background:none;outline:none;flex:1;
  font-size:15px;color:var(--ink);
}
.searchbar input::placeholder{color:var(--gray-2);}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--primary);color:#fff;font-weight:800;font-size:17px;
  border-radius:16px;padding:17px 20px;width:100%;
  letter-spacing:-.3px;transition:.14s;
  box-shadow:0 6px 16px rgba(32,192,161,.28);
}
.btn:active{transform:translateY(1px) scale(.995);background:var(--primary-press);}
.btn.ghost{background:var(--primary-050);color:var(--primary);box-shadow:none;}
.btn.ghost:active{background:var(--primary-100);}
.btn.line{background:#fff;color:var(--ink-2);border:1.5px solid var(--line-2);box-shadow:none;font-weight:700;}
.btn.sm{padding:12px 16px;font-size:15px;border-radius:13px;width:auto;}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none;}

/* ===== Chips / pills ===== */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--primary-050);color:var(--primary);
  font-weight:700;font-size:13.5px;
  padding:8px 13px;border-radius:999px;white-space:nowrap;
}
.pill-row{display:flex;gap:9px;overflow-x:auto;padding:2px 0;scrollbar-width:none;}
.pill-row::-webkit-scrollbar{display:none;}
.day-pill{
  flex:none;width:50px;height:50px;border-radius:15px;
  background:#fff;border:1.5px solid var(--line-2);
  color:var(--ink-2);font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;transition:.14s;
}
.day-pill.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(32,192,161,.3);}
.day-pill:active{transform:scale(.94);}

.dropdown{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--bg-soft);border:1px solid var(--line-2);
  border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;color:var(--ink-2);
}
.dropdown svg:first-child{color:var(--primary);}
.dropdown .chev{margin-left:auto;color:var(--gray-2);}

/* ===== Cards ===== */
.card{
  background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid #F1F2F4;
  overflow:hidden;
}
.tap{transition:.16s;cursor:pointer;}
.tap:active{transform:scale(.985);}

/* ===== Avatar / stack ===== */
.ava{border-radius:50%;object-fit:cover;background:var(--primary-100);flex:none;}
.ava-stack{display:flex;align-items:center;}
.ava-stack .ava{border:2.5px solid #fff;margin-left:-11px;}
.ava-stack .ava:first-child{margin-left:0;}
.ava-more{
  width:44px;height:44px;border-radius:50%;background:var(--primary-050);
  color:var(--primary);font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid #fff;margin-left:-11px;flex:none;
}

/* ===== Image with gradient fallback ===== */
.imgwrap{position:relative;height:100%;background:linear-gradient(135deg,#8fd9c9,#4bbea6);overflow:hidden;}
.hero-thumb{height:210px;border-radius:16px;overflow:hidden;margin-bottom:18px;}
.imgwrap img{width:100%;height:100%;object-fit:cover;}

/* ===== Tabbar ===== */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  display:flex;z-index:40;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--gray-2);font-size:11px;font-weight:600;transition:.14s;
}
.tab svg{width:24px;height:24px;}
.tab.active{color:var(--primary);}
.tab:active{transform:scale(.9);}

/* ===== Detail header ===== */
.dtopbar{
  position:sticky;top:0;z-index:40;
  height:calc(env(safe-area-inset-top) + 68px);
  pointer-events:none;
}
.dtopbar > .floatbtn{pointer-events:auto;}
.detail-hero{position:relative;margin-top:calc(-1 * (env(safe-area-inset-top) + 68px));}
.detail-hero .imgwrap{height:340px;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 32%);}
.floatbtn{
  position:absolute;top:calc(env(safe-area-inset-top) + 12px);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.95);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);z-index:5;
}
.floatbtn.back{left:16px;}
.floatbtn.fav{right:16px;}
.floatbtn.fav svg{width:22px;height:22px;color:var(--ink-2);transition:.16s;}
.floatbtn.fav.on{background:#fff;}
.floatbtn.fav.on svg{color:var(--primary);fill:var(--primary);}
.floatbtn.fav:active{transform:scale(.9);}
.sheet-card{
  position:relative;margin-top:-26px;background:#fff;
  border-radius:28px 28px 0 0;padding:26px 20px 20px;z-index:2;
}
.fav-btn{
  width:52px;height:52px;border-radius:50%;background:var(--primary-050);
  display:flex;align-items:center;justify-content:center;flex:none;transition:.16s;
}
.fav-btn.on{background:var(--primary-050);}
.fav-btn svg{color:var(--primary);transition:.16s;}
.fav-btn.on svg{fill:var(--primary);}
.fav-btn:active{transform:scale(.88);}

.statbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.stat .lab{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--gray);font-weight:600;}
.stat .val{font-size:16px;font-weight:800;color:var(--ink);}
.stat .lab svg{color:var(--primary);}
.stat-div{width:1px;height:34px;background:var(--line-2);}

.info-row{
  display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg-soft);
  border-radius:var(--radius-sm);transition:.14s;
}
.info-row:active{background:var(--primary-050);}
.info-ico{
  width:44px;height:44px;border-radius:12px;background:#fff;
  display:flex;align-items:center;justify-content:center;color:var(--primary);flex:none;
  box-shadow:var(--shadow-sm);
}

/* ===== sticky CTA ===== */
.cta-dock{
  position:absolute;left:0;right:0;bottom:0;
  padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 26%);
  z-index:30;
}

/* ===== Sheet / Modal ===== */
.scrim{
  position:absolute;inset:0;background:rgba(20,28,38,.46);
  opacity:0;pointer-events:none;transition:.24s;z-index:60;
}
.scrim.show{opacity:1;pointer-events:auto;}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:61;
  background:#fff;border-radius:26px 26px 0 0;
  padding:8px 20px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  max-height:88%;overflow-y:auto;
}
.sheet.show{transform:translateY(0);}
.grabber{width:42px;height:5px;border-radius:99px;background:var(--line-2);margin:8px auto 16px;}

/* ===== Form ===== */
.field{margin-bottom:16px;}
.field label{display:block;font-size:14px;font-weight:700;color:var(--ink-2);margin-bottom:8px;}
.field input,.field textarea,.field select{
  width:100%;border:1.5px solid var(--line-2);border-radius:13px;
  padding:14px 15px;font-size:15px;color:var(--ink);background:#fff;outline:none;transition:.14s;
}
.field textarea{resize:none;min-height:92px;line-height:1.5;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-050);}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt{
  padding:11px 15px;border:1.5px solid var(--line-2);border-radius:12px;
  font-weight:700;font-size:14px;color:var(--ink-2);transition:.14s;
}
.opt.on{border-color:var(--primary);background:var(--primary-050);color:var(--primary);}
.check-row{display:flex;align-items:flex-start;gap:11px;font-size:13.5px;color:var(--gray);line-height:1.5;padding:4px 0;}
.check-box{
  width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);flex:none;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:.14s;
}
.check-box.on{background:var(--primary);border-color:var(--primary);}

/* ===== Toast ===== */
.toast{
  position:absolute;left:50%;bottom:calc(var(--tabbar-h) + 24px);
  transform:translate(-50%,20px);
  background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  padding:13px 20px;border-radius:14px;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:.26s;z-index:80;white-space:nowrap;
  display:flex;align-items:center;gap:9px;max-width:88%;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast svg{color:var(--primary);flex:none;}

/* ===== list crew card ===== */
.crew-card{display:flex;gap:0;padding:0;align-items:stretch;}
.crew-thumb{width:132px;flex:none;}
.crew-thumb .imgwrap{height:100%;min-height:172px;}
.crew-body{flex:1;padding:15px 15px 15px 16px;min-width:0;}
.crew-meta{font-size:14px;color:var(--gray);margin-top:3px;}
.crew-meta b{color:var(--ink-2);font-weight:600;}
.rate{color:var(--primary);font-weight:800;}

/* section label */
.sec-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.more-link{font-size:13.5px;color:var(--gray);font-weight:600;display:flex;align-items:center;gap:2px;}

/* community */
.post{padding:18px 20px;border-bottom:8px solid var(--bg-soft);}
.post:last-child{border-bottom:none;}
.post-head{display:flex;align-items:center;gap:11px;margin-bottom:12px;}
.post-head .name{font-weight:700;font-size:15px;}
.post-head .sub{font-size:12.5px;color:var(--gray-2);}
.post-body{font-size:15px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;}
.post-tag{display:inline-block;margin-top:10px;color:var(--primary);font-weight:700;font-size:13.5px;}
.post-actions{display:flex;gap:20px;margin-top:14px;color:var(--gray);font-size:14px;font-weight:600;}
.post-act{display:flex;align-items:center;gap:6px;transition:.14s;}
.post-act.on{color:var(--danger);}
.post-act.on svg{fill:var(--danger);color:var(--danger);}
.post-act:active{transform:scale(.9);}

/* my page */
.profile-top{
  background:linear-gradient(135deg,var(--primary),#38cfae);
  padding:calc(env(safe-area-inset-top) + 26px) 20px 30px;color:#fff;
}
.mine-stat{display:flex;background:rgba(255,255,255,.16);border-radius:16px;padding:4px;margin-top:20px;}
.mine-stat > div{flex:1;text-align:center;padding:11px 4px;}
.mine-stat .n{font-size:20px;font-weight:800;}
.mine-stat .l{font-size:12px;opacity:.9;margin-top:2px;}
.menu-item{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);
  font-size:15.5px;font-weight:600;color:var(--ink-2);transition:.14s;
}
.menu-item:active{background:var(--bg-soft);}
.menu-item .mi-ico{color:var(--primary);display:flex;}
.menu-item .chev{margin-left:auto;color:var(--gray-2);}
.badge-count{background:var(--primary-050);color:var(--primary);font-weight:800;font-size:12px;padding:3px 9px;border-radius:99px;margin-left:auto;}

/* empty */
.empty{text-align:center;padding:60px 30px;color:var(--gray-2);}
.empty svg{color:var(--line-2);margin-bottom:14px;}
.empty .t{font-weight:700;color:var(--gray);font-size:16px;margin-bottom:6px;}

/* generic header for sub-screens */
.subhead{
  display:flex;align-items:center;gap:6px;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 12px;
  position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);z-index:20;
  border-bottom:1px solid var(--line);
}
.subhead .iconbtn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.subhead .iconbtn:active{background:var(--bg-soft);}
.subhead .title{font-size:17px;font-weight:800;letter-spacing:-.3px;}
.subhead .right{margin-left:auto;}

.divider{height:1px;background:var(--line);margin:20px 0;}
.spacer{height:8px;}
.hr-soft{height:8px;background:var(--bg-soft);}

/* success check */
.success-ico{
  width:88px;height:88px;border-radius:50%;background:var(--primary-050);
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px;color:var(--primary);
  animation:pop .4s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{0%{transform:scale(.4);opacity:0;}100%{transform:scale(1);opacity:1;}}

.review{padding:16px 0;border-bottom:1px solid var(--line);}
.review:last-child{border-bottom:none;}
.stars{color:var(--star);letter-spacing:1px;font-size:13px;}

a.link{color:var(--primary);font-weight:700;text-decoration:none;}
.fab{
  position:absolute;right:18px;bottom:calc(var(--tabbar-h) + 18px);
  width:56px;height:56px;border-radius:18px;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(32,192,161,.4);z-index:35;
}
.fab:active{transform:scale(.92);}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="viewport">
    <div id="app"></div>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
  <div class="scrim" id="scrim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function photo(url,cls){cls=cls||'';return '<div class="imgwrap '+cls+'"><img src="'+url+'" loading="lazy" onerror="this.style.display=\'none\'"></div>';}
function avatarImg(n,size){return '<img class="ava" style="width:'+size+'px;height:'+size+'px" src="'+ava(n)+'" onerror="this.style.opacity=0">';}
function avaStack(arr,total,size){
  size=size||44;
  let shown=arr.slice(0,4);
  let more=total-shown.length;
  let h='<div class="ava-stack">';
  shown.forEach(n=>h+=avatarImg(n,size));
  if(more>0)h+='<div class="ava-more" style="width:'+size+'px;height:'+size+'px">+'+more+'</div>';
  return h+'</div>';
}

/* ---------- Navigation ---------- */
function go(name,params){state.stack.push({name,params:params||{}});render();}
function back(){if(state.stack.length>1){state.stack.pop();render();}}
function root(tab){state.stack=[{name:tab}];render();}
function openDetail(id){go('detail',{id});}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg,icon){
  const t=$('#toast');
  t.innerHTML=(icon?I.check:'')+'<span>'+esc(msg)+'</span>';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2100);
}

/* ---------- Sheet ---------- */
function openSheet(html){
  $('#sheet').innerHTML='<div class="grabber"></div>'+html;
  $('#sheet').classList.add('show');
  $('#scrim').classList.add('show');
}
function closeSheet(){
  $('#sheet').classList.remove('show');
  $('#scrim').classList.remove('show');
}

/* ================= RENDER ================= */
function render(){
  const top=state.stack[state.stack.length-1];
  const html=SCREENS[top.name]?SCREENS[top.name](top.params||{}):'<div class="empty">화면을 찾을 수 없어요</div>';
  const showTab=ROOTS.includes(top.name)||top.name==='detail';
  const noTab=!showTab;
  $('#app').innerHTML='<div class="screen active'+(noTab?' no-tabbar':'')+'" id="screen">'+html+'</div>';
  renderTabbar(top.name);
  $('#tabbar').style.display=showTab?'flex':'none';
  const sc=$('#screen'); if(sc) sc.scrollTop=0;
}

function renderTabbar(active){
  const act=active==='detail'?'list':active;
  const tabs=[
    {id:'home',label:'홈',ic:I.home,icF:I.homeF},
    {id:'list',label:'크루 목록',ic:I.list,icF:I.listF},
    {id:'community',label:'커뮤니티',ic:I.chat,icF:I.chatF},
    {id:'my',label:'마이',ic:I.user,icF:I.userF}
  ];
  $('#tabbar').innerHTML=tabs.map(t=>
    '<button class="tab'+(t.id===act?' active':'')+'" onclick="root(\''+t.id+'\')">'+
    (t.id===act?t.icF:t.ic)+'<span>'+t.label+'</span></button>'
  ).join('');
}

function filterCrews(){

  const q=state.listQuery.trim().replace('#','');
  if(q) r=r.filter(c=>(c.name+c.region+c.tags.join('')+c.pace).replace('#','').includes(q));
  return r;

    ${menuItem(I.list,'내 크루',"go('myCrews')",u.joined.length)}
    ${menuItem(I.flag,'신청 현황',"go('applied')",state.applied.size||null)}
    ${menuItem(I.heartLine,'찜한 크루',"go('favorites')",state.fav.size||null)}
    ${menuItem(I.trophy,'러닝 기록',"toast('이번 달 42.5km 달렸어요! 🎉')")}
    <div class="hr-soft"></div>
    ${menuItem(I.bell,'알림 설정',"go('settings')")}
    ${menuItem(I.info,'앱 정보',"openAbout()")}
    ${menuItem(I.logout,'로그아웃',"toast('로그아웃 되었어요')")}
  </div>`;
};
function menuItem(ic,label,onclick,count){
  return `<button class="menu-item" style="width:100%;text-align:left;background:none" onclick="${onclick}">
    <span class="mi-ico">${ic}</span><span>${label}</span>
    ${count?`<span class="badge-count">${count}</span>`:`<span class="chev">${I.chev}</span>`}
  </button>`;
}
function openEditProfile(){
  openSheet(`<div class="h3" style="margin-bottom:18px">프로필 수정</div>
    <div class="field"><label>닉네임</label><input id="edName" value="${esc(state.user.name)}"></div>
    <div class="field"><label>활동 지역</label><input id="edRegion" value="${esc(state.user.region)}"></div>
    <div class="field"><label>평소 페이스</label><input id="edPace" value="${esc(state.user.pace)}"></div>
    <button class="btn" onclick="saveProfile()">저장하기</button>`);
}
function saveProfile(){
  state.user.name=($('#edName').value||'').trim()||state.user.name;
  state.user.region=($('#edRegion').value||'').trim()||state.user.region;
  state.user.pace=($('#edPace').value||'').trim()||state.user.pace;
  closeSheet();render();toast('프로필을 저장했어요',true);
}
function openAbout(){
  openSheet(`<div style="text-align:center;padding:8px 6px 4px">
    <div style="width:64px;height:64px;border-radius:20px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 16px">${I.route.replace('width="18" height="18"','width="32" height="32"')}</div>
    <div class="h2">런크루</div>
    <div class="muted" style="margin:8px 0 4px">Project A · 러닝 크루 매칭</div>
    <div class="tiny muted">v1.0.0 · 대전 지역 서비스</div>
    <div style="height:20px"></div>
    <button class="btn ghost" onclick="closeSheet()">닫기</button></div>`);
}

/* ---- MY CREWS ---- */
SCREENS.myCrews=()=>{
  const list=state.user.joined.map(crewById).filter(Boolean);
  return `<div class="subhead"><button class="iconbtn" onclick="back()">${I.back}</button><span class="title">내 크루</span></div>
  <div class="pad" style="padding-top:20px">
    ${list.length?'<div style="display:flex;flex-direction:column;gap:16px">'+list.map(listCard).join('')+'</div>'
      :`<div class="empty">${I.list}<div class="t">참여 중인 크루가 없어요</div><button class="btn ghost" style="margin-top:16px;width:auto;display:inline-flex" onclick="root('list')">크루 둘러보기</button></div>`}
  </div>`;
};

/* ---- APPLIED ---- */
SCREENS.applied=()=>{
  const list=[...state.applied].map(crewById).filter(Boolean);
  return `<div class="subhead"><button class="iconbtn" onclick="back()">${I.back}</button><span class="title">신청 현황</span></div>
  <div class="pad" style="padding-top:20px">
    ${list.length?'<div style="display:flex;flex-direction:column;gap:14px">'+list.map(c=>`
      <div class="card" style="padding:16px;display:flex;align-items:center;gap:14px">
        <div style="width:56px;height:56px;flex:none;border-radius:14px;overflow:hidden">${photo(c.img)}</div>
        <div style="flex:1"><div class="h3" style="font-size:16px">${c.name}</div>
          <div style="margin-top:6px"><span class="chip" style="background:#FFF4E0;color:#D98A00;font-size:12.5px">● 승인 대기중</span></div></div>
        <button class="btn line sm" onclick="cancelApply('${c.id}')">취소</button>
      </div>`).join('')+'</div>'
      :`<div class="empty">${I.flag}<div class="t">신청 내역이 없어요</div><button class="btn ghost" style="margin-top:16px;width:auto;display:inline-flex" onclick="root('list')">크루 찾아보기</button></div>`}
  </div>`;
};
function cancelApply(id){state.applied.delete(id);render();toast('신청을 취소했어요');}

/* ---- FAVORITES ---- */
SCREENS.favorites=()=>{
  const list=[...state.fav].map(crewById).filter(Boolean);
  return `<div class="subhead"><button class="iconbtn" onclick="back()">${I.back}</button><span class="title">찜한 크루</span></div>
  <div class="pad" style="padding-top:20px">
    ${list.length?'<div style="display:flex;flex-direction:column;gap:16px">'+list.map(listCard).join('')+'</div>'
      :`<div class="empty">${I.heartLine}<div class="t">찜한 크루가 없어요</div><div class="tiny">마음에 드는 크루를 하트로 저장해보세요</div></div>`}
  </div>`;
};

/* ---- SETTINGS ---- */
SCREENS.settings=()=>{
  return `<div class="subhead"><button class="iconbtn" onclick="back()">${I.back}</button><span class="title">알림 설정</span></div>
  <div style="padding:12px 0">
    ${toggleRow('정규런 일정 알림',true)}
    ${toggleRow('크루 신청 승인 알림',true)}
    ${toggleRow('커뮤니티 댓글 알림',false)}
    ${toggleRow('추천 크루 알림',true)}
    ${toggleRow('마케팅 정보 수신',false)}
  </div>`;
};
function toggleRow(label,on){
  return `<button class="menu-item" style="width:100%;background:none" onclick="flipToggle(this)" data-on="${on?1:0}">
    <span>${label}</span>
    <span class="tgl" style="margin-left:auto;width:46px;height:27px;border-radius:99px;background:${on?'var(--primary)':'var(--line-2)'};position:relative;transition:.2s;display:inline-block">
      <span class="knob" style="position:absolute;top:3px;left:${on?'22px':'3px'};width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></span>
    </span>
  </button>`;
}
function flipToggle(btn){
  const on=btn.getAttribute('data-on')==='1';
  const next=!on;
  btn.setAttribute('data-on',next?'1':'0');
  const tgl=btn.querySelector('.tgl'), knob=btn.querySelector('.knob');
  tgl.style.background=next?'var(--primary)':'var(--line-2)';
  knob.style.left=next?'22px':'3px';
  toast(next?'알림을 켰어요':'알림을 껐어요',next);
}

/* ---------- init ---------- */
render();

</script>
</body>
</html>
